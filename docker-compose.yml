version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        volumes:
            - ./:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=tasks_db
            - DB_USERNAME=root
            - DB_PASSWORD=secret
            - MONGO_DB_CONNECTION=mongodb
            - MONGO_DB_HOST=mongo
            - MONGO_DB_PORT=27017
            - MONGO_DB_DATABASE=audit_logs_db
            - MONGO_DB_USERNAME=
            - MONGO_DB_PASSWORD=
        depends_on:
            - mysql
            - mongo
        networks:
            - task-management-network

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: tasks_db
            MYSQL_USER: task_user
            MYSQL_PASSWORD: task_password
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
        networks:
            - task-management-network

    mongo:
        image: mongo:7.0
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: secret
            MONGO_INITDB_DATABASE: audit_logs_db
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
            - ./docker/mongo/init:/docker-entrypoint-initdb.d
        networks:
            - task-management-network

    mongo-express:
        image: mongo-express:1.0.2
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: admin
            ME_CONFIG_MONGODB_ADMINPASSWORD: secret
            ME_CONFIG_MONGODB_URL: mongodb://admin:secret@mongo:27017/
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: admin
        ports:
            - "8081:8081"
        depends_on:
            - mongo
        networks:
            - task-management-network

volumes:
    mysql_data:
    mongo_data:

networks:
    task-management-network:
        driver: bridge
