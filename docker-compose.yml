version: "3.8"

services:
    # ===============================================
    # APPLICATION SERVICE
    # ===============================================
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${APP_PORT:-8000}:8000"
        volumes:
            - ./:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        environment:
            - APP_NAME=${APP_NAME}
            - APP_ENV=${APP_ENV}
            - APP_DEBUG=${APP_DEBUG}
            - APP_URL=${APP_URL}
            - APP_KEY=${APP_KEY}
            - LOG_CHANNEL=${LOG_CHANNEL}
            - LOG_LEVEL=${LOG_LEVEL}
            # MySQL Variables
            - DB_CONNECTION=${DB_CONNECTION}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            # MongoDB Variables
            - MONGO_DB_CONNECTION=${MONGO_DB_CONNECTION}
            - MONGO_DB_HOST=${MONGO_DB_HOST}
            - MONGO_DB_PORT=${MONGO_DB_PORT}
            - MONGO_DB_DATABASE=${MONGO_DB_DATABASE}
            - MONGO_DB_USERNAME=${MONGO_DB_USERNAME}
            - MONGO_DB_PASSWORD=${MONGO_DB_PASSWORD}
            # Cache & Session
            - CACHE_DRIVER=${CACHE_DRIVER}
            - SESSION_DRIVER=${SESSION_DRIVER}
            - SESSION_LIFETIME=${SESSION_LIFETIME}
            # Mail
            - MAIL_MAILER=${MAIL_MAILER}
            - MAIL_HOST=${MAIL_HOST}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
            - MAIL_FROM_NAME=${MAIL_FROM_NAME}
            # Sanctum
            - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
            mongo:
                condition: service_healthy
        networks:
            - task-management-network
        restart: unless-stopped

    # ===============================================
    # MYSQL DATABASE SERVICE
    # ===============================================
    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
        networks:
            - task-management-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${MYSQL_ROOT_PASSWORD}",
                ]
            timeout: 20s
            retries: 10
            interval: 30s

    # ===============================================
    # MONGODB DATABASE SERVICE
    # ===============================================
    mongo:
        image: mongo:7.0
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
            MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
        ports:
            - "${MONGO_PORT:-27017}:27017"
        volumes:
            - mongo_data:/data/db
            - ./docker/mongo/init:/docker-entrypoint-initdb.d
        networks:
            - task-management-network
        restart: unless-stopped
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_INITDB_DATABASE} --quiet
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 40s

    # ===============================================
    # MONGO EXPRESS (Admin Interface)
    # ===============================================
    mongo-express:
        image: mongo-express:1.0.2
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
            ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASIC_AUTH_USERNAME}
            ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASIC_AUTH_PASSWORD}
        ports:
            - "${MONGO_EXPRESS_PORT:-8081}:8081"
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - task-management-network
        restart: unless-stopped

# ===============================================
# VOLUMES
# ===============================================
volumes:
    mysql_data:
        driver: local
    mongo_data:
        driver: local

# ===============================================
# NETWORKS
# ===============================================
networks:
    task-management-network:
        driver: bridge
